name: Build Metroplus APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-metroplus.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      METROLIST_APPLICATION_ID: com.metroplus.music
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cari task lalu build
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:tasks --all --no-daemon -q > tasks.txt 2>&1 || true
          echo "=== task assemble Debug yang tersedia ==="
          grep -oE 'assemble[A-Za-z]*Debug' tasks.txt | sort -u
          TASK=$(grep -oE 'assemble[A-Za-z]*Debug' tasks.txt | sort -u | grep -i foss | grep -i universal | head -1 || true)
          if [ -z "$TASK" ]; then TASK=$(grep -oE 'assemble[A-Za-z]*Debug' tasks.txt | sort -u | grep -i foss | head -1 || true); fi
          if [ -z "$TASK" ]; then TASK=assembleDebug; fi
          echo "Task yang dipakai: $TASK"
          ./gradlew :androidApp:$TASK --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Metroplus-apk
          path: '**/build/outputs/apk/**/*.apk'
