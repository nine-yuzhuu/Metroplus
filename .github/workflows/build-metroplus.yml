name: Build Metroplus APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-metroplus.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METROLIST_APPLICATION_ID: com.metroplus.music
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleFossDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Metroplus-apk
          path: app/build/outputs/apk/foss/debug/*.apk
