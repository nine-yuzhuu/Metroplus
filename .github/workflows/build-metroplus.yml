name: Build Metroplus APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-metroplus.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METROLIST_APPLICATION_ID: com.metroplus.music
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          TASK=$(./gradlew :app:tasks --all -q --no-daemon | grep -oE 'assemble[A-Za-z]*Foss[A-Za-z]*Debug' | grep -i universal | head -1 || true)
          echo "Task yang dipakai: $TASK"
          if [ -z "$TASK" ]; then TASK=assembleUniversalFossDebug; fi
          ./gradlew :app:$TASK --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Metroplus-apk
          path: app/build/outputs/apk/**/*.apk
