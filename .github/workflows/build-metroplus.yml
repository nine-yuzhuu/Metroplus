name: Build Metroplus APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-metroplus.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      METROLIST_APPLICATION_ID: com.metroplus.music
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Diagnostik
        run: |
          echo "=== isi folder ==="
          ls -la
          echo "=== settings ==="
          cat settings.gradle* 2>/dev/null | head -50
          echo "=== daftar modul ==="
          chmod +x gradlew
          ./gradlew projects --no-daemon -q 2>&1 | head -40 || true

      - name: Build APK
        run: ./gradlew assembleUniversalFossDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Metroplus-apk
          path: '**/build/outputs/apk/**/*.apk'
