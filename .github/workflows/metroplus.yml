name: Build Metroplus
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      METROLIST_APPLICATION_ID: com.metroplus.music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew assembleFossDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Metroplus-apk
          path: app/build/outputs/apk/foss/debug/*.apk
